[package]
name = "struct_frame_fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Cargo-fuzz scaffold for the struct-frame Rust streaming parser.
#
# Setup:
#     cargo install cargo-fuzz
#     python tests/fuzz/make_seed_corpus.py tests/rust/fuzz/corpus/parser
#     cd tests/rust/fuzz
#     cargo +nightly fuzz run parser -- -max_len=4096 -runs=100000

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The runtime sources are compiled straight from src/ via the driver crate, so no generation
# step is needed first.
struct_frame_sdk = { path = "../../fuzz/drivers/rust" }

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
