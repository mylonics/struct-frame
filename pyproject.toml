[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "struct-frame"
version = "0.10.10"
authors = [
  { name="Rijesh Augustine", email="rijesh@mylonics.com" },
]
dependencies = [
    "proto-schema-parser>=2.0.0",
    # structframe.toml support (tomllib is in the standard library from Python 3.11)
    "tomli>=1.1.0; python_version < '3.11'",
]
description = "Generate fixed-layout messages and framing code for C, C++, Python, TypeScript, JavaScript, C# and Rust from one schema"
keywords = ["serialization", "code-generator", "framing", "embedded", "serial", "protocol", "uart", "mavlink", "protobuf"]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: C#",
    "Programming Language :: Rust",
    "Topic :: Communications",
    "Topic :: Software Development :: Embedded Systems",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

# Optional runtime dependencies of the generated Python SDK transports (the
# generator itself needs neither).
[project.optional-dependencies]
serial = ["pyserial"]
# WebSocketTransport uses websocket-client; AsyncWebSocketTransport uses websockets.
websocket = ["websocket-client", "websockets"]
sdk = ["pyserial", "websocket-client", "websockets"]
# Everything the test suite uses beyond the generator itself.
test = ["pytest", "hypothesis", "graphql-core", "pyserial", "websocket-client", "websockets"]

[project.scripts]
struct-frame = "struct_frame:main"

[project.urls]
Homepage = "https://github.com/mylonics/struct-frame"
Documentation = "https://struct-frame.mylonics.com"
Changelog = "https://github.com/mylonics/struct-frame/blob/main/CHANGELOG.md"
Issues = "https://github.com/mylonics/struct-frame/issues"

[tool.hatch.build.targets.sdist.force-include]
"src/struct_frame/boilerplate" = "src/struct_frame/boilerplate"
"src/struct_frame/boilerplate/cpp/struct_frame_sdk/asio-repo/asio/include/asio" = "src/struct_frame/boilerplate/cpp/struct_frame_sdk/asio-repo/asio/include/asio"


[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["generated", "py", "ts", "js", "c", "cpp", "csharp", "rust", "build", ".git", "api_stability", "benchmarks"]
